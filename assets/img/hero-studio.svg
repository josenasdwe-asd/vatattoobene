<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="roomGlow" cx="52%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2a261e"/>
      <stop offset=".48" stop-color="#151412"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="78%" cy="16%" r="38%">
